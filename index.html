<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Happy Birthday Nguyễn Thị Kim Oanh  ❤️</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050814;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
    }

    /* Canvas cho pháo hoa background */
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Overlay container chung cho UI */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      background: rgba(5, 8, 20, 0.85);
      backdrop-filter: blur(8px);
      transition: opacity 0.8s ease, visibility 0.8s;
    }

    .hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* Nút START kiểu Neon */
    .btn-neon {
      padding: 18px 52px;
      font-size: 1.6rem;
      font-weight: bold;
      color: #00f3ff;
      background: transparent;
      border: 2px solid #00f3ff;
      border-radius: 50px;
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.4), inset 0 0 15px rgba(0, 243, 255, 0.4);
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 2px;
      transition: all 0.3s ease;
    }

    .btn-neon:hover, .btn-neon:active {
      background: #00f3ff;
      color: #000;
      box-shadow: 0 0 30px rgba(0, 243, 255, 0.8);
      transform: scale(1.05);
    }

    /* Đếm ngược */
    .countdown {
      font-size: 7rem;
      font-weight: 800;
      color: #00f3ff;
      text-shadow: 0 0 20px #00f3ff, 0 0 40px #00f3ff;
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      from { transform: scale(0.9); opacity: 0.8; }
      to { transform: scale(1.1); opacity: 1; }
    }

    /* Popup thông điệp bùng nổ */
    .card-popup {
      background: rgba(15, 23, 42, 0.9);
      border: 2px solid #00f3ff;
      box-shadow: 0 0 35px rgba(0, 243, 255, 0.6), inset 0 0 15px rgba(0, 243, 255, 0.3);
      border-radius: 20px;
      padding: 35px 30px;
      text-align: center;
      max-width: 85%;
      width: 380px;
      animation: popExplode 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popExplode {
      0% { transform: scale(0) rotate(-10deg); opacity: 0; }
      50% { transform: scale(1.15) rotate(3deg); opacity: 1; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }

    .card-popup h2 {
      font-size: 1.7rem;
      color: #00f3ff;
      text-shadow: 0 0 15px #00f3ff, 0 0 30px #00f3ff;
      line-height: 1.4;
    }

    /* Container chứa các bong bóng trôi nổi */
    #bubbles-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
      pointer-events: none;
    }

    .bubble {
      position: absolute;
      background: rgba(10, 25, 47, 0.85);
      border: 1px solid rgba(0, 243, 255, 0.5);
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
      color: #e0f2fe;
      white-space: nowrap;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: floatUp linear infinite;
      pointer-events: auto;
    }

    /* Bong bóng chữ */
    .bubble.text-bubble {
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 0.95rem;
    }

    /* Bong bóng ảnh riêng biệt: Khung vuông bo tròn to hơn */
    .bubble.img-bubble {
      padding: 6px;
      border-radius: 22px; /* Bo tròn khung ngoài */
    }

    .bubble.img-bubble img {
      width: 110px;  /* Tăng kích thước ảnh to hơn */
      height: 110px;
      border-radius: 18px; /* Khung hình vuông bo tròn góc */
      object-fit: cover;
      border: 2px solid #00f3ff;
      box-shadow: 0 0 12px rgba(0, 243, 255, 0.7);
      display: block;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(105vh) scale(0.8);
        opacity: 0;
      }
      10% { opacity: 0.95; }
      90% { opacity: 0.95; }
      100% {
        transform: translateY(-25vh) scale(1);
        opacity: 0;
      }
    }

    /* Hiệu ứng Rung màn hình khi bùng nổ */
    .shake-screen {
      animation: shake 0.5s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translate(0, 0); }
      20% { transform: translate(-10px, 5px); }
      40% { transform: translate(10px, -5px); }
      60% { transform: translate(-5px, 10px); }
      80% { transform: translate(5px, -10px); }
    }
  </style>
</head>
<body id="app-body">

  <audio id="bg-audio" src="https://files.catbox.moe/qaqm2b.mp3" preload="auto" loop></audio>

  <canvas id="fireworksCanvas"></canvas>

  <div id="start-screen" class="overlay">
    <button class="btn-neon" onclick="startApp()">START</button>
  </div>

  <div id="countdown-screen" class="overlay hidden">
    <div id="countdown-number" class="countdown">12</div>
  </div>

  <div id="greeting-screen" class="overlay hidden">
    <div class="card-popup">
      <h2>Forever Grateful for You.<br>Happy Birthday, Nguyễn thị Kim Oanh ❤️</h2>
    </div>
  </div>

  <div id="bubbles-container"></div>

  <script>
    const bgAudio = document.getElementById('bg-audio');

    window.addEventListener('DOMContentLoaded', () => {
      bgAudio.play().catch(() => {});
    });

    // --- DANH SÁCH LỜI CHÚC VÀ ẢNH TÁCH BIỆT ---
    const textMessages = [
      "Happy Birthday to my Mouse friend 💖",
      "Chúc Oanh mọi bước đi đều tràn ngập hạnh phúc 🎉",
      "Here's to more beautiful memories together ✨",
      "Forever Grateful for You. Happy Birthday, Nguyễn thị Kim Oanh ❤️",
      "Chúc mừng sinh nhật chuột ! 🎂",
      "Chúc Oanh tuổi mới luôn rực rỡ và thành công! 🌟",
      "Luôn vui vẻ, xinh đẹp và bình an nhé Oanh! ✨"
    ];

    const imagesList = [
      "https://files.catbox.moe/2k0vtm.jpg",
      "https://files.catbox.moe/8l445b.jpg",
      "https://files.catbox.moe/802b7x.jpg",
      "https://files.catbox.moe/1zg6nm.jpg",
      "https://files.catbox.moe/wtj8kx.jpg"
    ];

    function startApp() {
      bgAudio.currentTime = 0;
      bgAudio.play().catch(e => console.log("Audio Error:", e));

      document.getElementById('start-screen').classList.add('hidden');
      const countScreen = document.getElementById('countdown-screen');
      const countNum = document.getElementById('countdown-number');
      countScreen.classList.remove('hidden');

      let count = 12;
      countNum.innerText = count;

      const timer = setInterval(() => {
        count--;
        if (count > 0) {
          countNum.innerText = count;
        } else {
          clearInterval(timer);
          countScreen.classList.add('hidden');
          
          const greetingScreen = document.getElementById('greeting-screen');
          greetingScreen.classList.remove('hidden');
          
          triggerExplosionEffect();
          startFireworksAuto(); 
          spawnBubbles();       

          setTimeout(() => {
            greetingScreen.classList.add('hidden');
          }, 3000); 
        }
      }, 1000);
    }

    function triggerExplosionEffect() {
      const body = document.getElementById('app-body');
      body.classList.add('shake-screen');
      setTimeout(() => body.classList.remove('shake-screen'), 500);

      for (let i = 0; i < 20; i++) {
        setTimeout(() => {
          const x = Math.random() * (width - 100) + 50;
          const targetY = Math.random() * (height * 0.5) + 50;
          createExplosion(x, targetY, true);
        }, i * 50);
      }
    }

    let bubbleInterval = null;
    function spawnBubbles() {
      if (bubbleInterval) return;
      const container = document.getElementById('bubbles-container');
      
      // GIẢM TẦN SUẤT: Giảm sinh bong bóng từ 200ms xuống 400ms (mỗi 0.4s sinh 1 cái)
      bubbleInterval = setInterval(() => {
        const bubble = document.createElement('div');
        
        // Ngẫu nhiên chọn tạo Bong Bóng Lời Chúc hoặc Bong Bóng Ảnh
        const isImageBubble = Math.random() < 0.4; // 40% ra ảnh, 60% ra lời chúc

        if (isImageBubble) {
          bubble.className = 'bubble img-bubble';
          const imgUrl = imagesList[Math.floor(Math.random() * imagesList.length)];
          bubble.innerHTML = `<img src="${imgUrl}" alt="photo">`;
        } else {
          bubble.className = 'bubble text-bubble';
          const txt = textMessages[Math.floor(Math.random() * textMessages.length)];
          bubble.innerHTML = `<span>${txt}</span>`;
        }
        
        const randomX = Math.random() * 85 + 2; // Rải đều từ 2% - 87% màn hình
        const duration = Math.random() * 4 + 5; // 5s - 9s

        bubble.style.left = `${randomX}%`;
        bubble.style.animationDuration = `${duration}s`;

        container.appendChild(bubble);

        setTimeout(() => {
          bubble.remove();
        }, duration * 1000);
      }, 400);
    }

    /* --- HỆ THỐNG PHÁO HOA CÓ VỆT SÁNG BAY LÊN (ĐÃ NÂNG CẤP) --- */
    const canvas = document.getElementById('fireworksCanvas');
    const ctx = canvas.getContext('2d');
    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    const colors = ['#00f3ff', '#ff007f', '#ffbe0b', '#00ff66', '#ffffff', '#ff5000', '#e0aaff'];

    class Firework {
      constructor(startX, startY, targetX, targetY, isBig = false) {
        this.x = startX;
        this.y = startY;
        this.startX = startX;
        this.startY = startY;
        this.targetX = targetX;
        this.targetY = targetY;
        this.isBig = isBig;
        this.distanceToTarget = Math.hypot(targetX - startX, targetY - startY);
        this.distanceTraveled = 0;
        
        // Vệt sáng đuôi dài và sáng rõ
        this.history = [];
        this.maxHistory = 15; // Tăng độ dài đuôi
        this.angle = Math.atan2(targetY - startY, targetX - startX);
        this.speed = Math.random() * 3 + 9;
        this.color = colors[Math.floor(Math.random() * colors.length)];
      }

      update(index) {
        this.history.push({ x: this.x, y: this.y });
        if (this.history.length > this.maxHistory) {
          this.history.shift();
        }

        const vx = Math.cos(this.angle) * this.speed;
        const vy = Math.sin(this.angle) * this.speed;
        
        this.x += vx;
        this.y += vy;

        // Tạo hiệu ứng vệt bụi sáng nhỏ rơi ra dọc đường bay
        if (Math.random() < 0.6) {
          particles.push(new Sparkle(this.x, this.y, this.color));
        }

        this.distanceTraveled = Math.hypot(this.x - this.startX, this.y - this.startY);

        if (this.distanceTraveled >= this.distanceToTarget) {
          createExplosion(this.targetX, this.targetY, this.isBig, this.color);
          fireworks.splice(index, 1);
        }
      }

      draw() {
        ctx.save();
        ctx.beginPath();
        if (this.history.length > 0) {
          ctx.moveTo(this.history[0].x, this.history[0].y);
          for (let p of this.history) {
            ctx.lineTo(p.x, p.y);
          }
        } else {
          ctx.moveTo(this.x, this.y);
        }
        ctx.lineTo(this.x, this.y);
        ctx.strokeStyle = this.color;
        ctx.lineWidth = 3.5;
        ctx.lineCap = 'round';
        ctx.shadowBlur = 15;
        ctx.shadowColor = this.color;
        ctx.stroke();
        ctx.restore();
      }
    }

    // Lớp hạt bụi sáng rơi dọc đường pháo hoa bay lên
    class Sparkle {
      constructor(x, y, color) {
        this.x = x + (Math.random() - 0.5) * 4;
        this.y = y + (Math.random() - 0.5) * 4;
        this.color = color;
        this.radius = Math.random() * 1.5 + 0.5;
        this.vx = (Math.random() - 0.5) * 1;
        this.vy = Math.random() * 1 + 0.5;
        this.alpha = 1;
        this.decay = Math.random() * 0.04 + 0.03;
      }

      update(index) {
        this.x += this.vx;
        this.y += this.vy;
        this.alpha -= this.decay;
        if (this.alpha <= 0) {
          particles.splice(index, 1);
        }
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.shadowBlur = 8;
        ctx.shadowColor = this.color;
        ctx.fill();
        ctx.restore();
      }
    }

    class Particle {
      constructor(x, y, color, isBig = false) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.radius = isBig ? Math.random() * 3.5 + 1.5 : Math.random() * 2 + 1;
        const angle = Math.random() * Math.PI * 2;
        const speed = isBig ? Math.random() * 10 + 2 : Math.random() * 6 + 1;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.alpha = 1;
        this.decay = Math.random() * 0.015 + 0.008;
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 10;
        ctx.shadowColor = this.color;
        ctx.fill();
        ctx.restore();
      }

      update(index) {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += 0.05; 
        this.alpha -= this.decay;

        if (this.alpha <= 0) {
          particles.splice(index, 1);
        }
      }
    }

    let fireworks = [];
    let particles = [];

    function launchFirework(targetX, targetY, isBig = false) {
      const startX = Math.random() * (width - 100) + 50;
      const startY = height;
      fireworks.push(new Firework(startX, startY, targetX, targetY, isBig));
    }

    function createExplosion(x, y, isBig = false, explosionColor = null) {
      const color = explosionColor || colors[Math.floor(Math.random() * colors.length)];
      const count = isBig ? 80 : 45;
      for (let i = 0; i < count; i++) {
        particles.push(new Particle(x, y, color, isBig));
      }
    }

    function animate() {
      // Chỉnh độ trong suốt mờ nền giúp đuôi pháo hoa giữ lại mịn màng hơn
      ctx.fillStyle = 'rgba(5, 8, 20, 0.12)';
      ctx.fillRect(0, 0, width, height);

      for (let i = fireworks.length - 1; i >= 0; i--) {
        fireworks[i].update(i);
        if (fireworks[i]) fireworks[i].draw();
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update(i);
        if (particles[i]) particles[i].draw();
      }

      requestAnimationFrame(animate);
    }

    function startFireworksAuto() {
      setInterval(() => {
        const x = Math.random() * (width - 100) + 50;
        const y = Math.random() * (height * 0.5) + 80;
        launchFirework(x, y);
      }, 500);
    }

    window.addEventListener('pointerdown', (e) => {
      if (document.getElementById('countdown-screen').classList.contains('hidden')) {
        launchFirework(e.clientX, e.clientY, true);
      }
    });

    animate();
  </script>
</body>
</html>
